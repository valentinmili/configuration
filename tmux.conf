# ── Mouse & basics ──────────────────────────────────────────
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Status-bar tabs switch on a plain click, even when the terminal reports
# the click as a release or a repeated-click event.
bind -n MouseDown1Status select-window -t =
bind -n MouseUp1Status select-window -t =
bind -n DoubleClick1Status select-window -t =

# Pane focus also works on click release.
bind -n MouseDown1Pane select-pane -t = \; if -Ft= "#{mouse_any_flag}" "send-keys -M"
bind -n MouseUp1Pane if -Ft= "#{mouse_any_flag}" "select-pane -t = ; send-keys -M" "select-pane -t ="
bind -n MouseDown1Border select-pane -t =
bind -n MouseUp1Border select-pane -t =
bind -n MouseDrag1Border resize-pane -M

# Auto re-tile panes when one is created or closed.
# Not after resize — that would cancel pane zoom and manual sizing.
set-hook -g after-split-window "select-layout tiled"
set-hook -g pane-exited "select-layout tiled"
set-hook -gu after-resize-pane

# ── Copy to system clipboard ────────────────────────────────
if-shell "command -v pbcopy >/dev/null 2>&1" {
    bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell "command -v xclip >/dev/null 2>&1" {
        bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    } {
        bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
    }
}

# Mouse wheel scrolls tmux history
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Don't copy on mouse select — just highlight. Enter copies.
unbind -T copy-mode    MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# ── Agent management ────────────────────────────────────────
# Agent panes keep a wrapper shell alive so Ctrl-C exits the agent and drops
# back to zsh instead of closing the pane.
# yolo (bin/yolo) is claude with skip-permissions, started in ~/work when the
# pane is on $HOME so the folder-trust prompt is answered once ever; codex takes
# --yolo; opencode has no flag — it runs with full permissions via
# "permission": "allow" in ~/.config/opencode/opencode.json.

# M-c / M-x / M-o / M-t: new PANE (split + tile)
bind -n M-c split-window -h -c '#{pane_current_path}' 'trap : INT; yolo; exec $SHELL -l' \; set-option -p @pane_label claude \; select-layout tiled
bind -n M-x split-window -h -c '#{pane_current_path}' 'trap : INT; codex --yolo; exec $SHELL -l' \; set-option -p @pane_label codex \; select-layout tiled
bind -n M-o split-window -h -c '#{pane_current_path}' 'trap : INT; opencode; exec $SHELL -l' \; set-option -p @pane_label opencode \; select-layout tiled
bind -n M-t split-window -h -c '#{pane_current_path}' \; set-option -p @pane_label shell \; select-layout tiled

# M-C / M-X / M-O / M-T: new TAB (own window)
bind -n M-C new-window -n claude   -c '#{pane_current_path}' 'trap : INT; yolo; exec $SHELL -l'
bind -n M-X new-window -n codex    -c '#{pane_current_path}' 'trap : INT; codex --yolo; exec $SHELL -l'
bind -n M-O new-window -n opencode -c '#{pane_current_path}' 'trap : INT; opencode; exec $SHELL -l'
bind -n M-T new-window -n shell    -c '#{pane_current_path}'

# M-n: menu to pick what to spawn as a pane
# M-m is an alias: cmux's embedded ghostty loses dead-key Option combos
# (e/i/u/n/`) to macOS composition, so M-n may never arrive there.
bind -n M-n display-menu -T " New Pane " -x C -y C \
    "Claude Code"  c "split-window -h -c '#{pane_current_path}' 'trap : INT; yolo; exec $SHELL -l' ; set-option -p @pane_label claude ; select-layout tiled" \
    "Codex"        x "split-window -h -c '#{pane_current_path}' 'trap : INT; codex --yolo; exec $SHELL -l' ; set-option -p @pane_label codex ; select-layout tiled" \
    "OpenCode"     o "split-window -h -c '#{pane_current_path}' 'trap : INT; opencode; exec $SHELL -l' ; set-option -p @pane_label opencode ; select-layout tiled" \
    "Shell"        s "split-window -h -c '#{pane_current_path}' ; set-option -p @pane_label shell ; select-layout tiled" \
    ""             "" "" \
    "Cancel"       q ""
bind -n M-m display-menu -T " New Pane " -x C -y C \
    "Claude Code"  c "split-window -h -c '#{pane_current_path}' 'trap : INT; yolo; exec $SHELL -l' ; set-option -p @pane_label claude ; select-layout tiled" \
    "Codex"        x "split-window -h -c '#{pane_current_path}' 'trap : INT; codex --yolo; exec $SHELL -l' ; set-option -p @pane_label codex ; select-layout tiled" \
    "OpenCode"     o "split-window -h -c '#{pane_current_path}' 'trap : INT; opencode; exec $SHELL -l' ; set-option -p @pane_label opencode ; select-layout tiled" \
    "Shell"        s "split-window -h -c '#{pane_current_path}' ; set-option -p @pane_label shell ; select-layout tiled" \
    ""             "" "" \
    "Cancel"       q ""

# ── Navigation ──────────────────────────────────────────────
bind -n M-Tab next-window
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5

# Pane navigation (vim hjkl)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-r next-layout
bind -n M-z resize-pane -Z
bind -n M-w kill-pane
bind -n M-d detach-client
bind -n M-q confirm-before -p "Kill workspace? (y/n)" kill-session

# M-p: rename the current pane. Stored in a pane-local option so apps that
# set terminal titles (agent spinners) cannot overwrite the displayed name.
bind -n M-p command-prompt -p "Pane name:" -I "#{?@pane_label,#{@pane_label},#{pane_title}}" "set-option -p @pane_label '%%'"

# M-y: switch session
bind -n M-y choose-tree -s -O name

# M-g: lazygit popup
bind -n M-g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E 'lazygit'

# M-f: file manager popup (yazi)
bind -n M-f display-popup -d '#{pane_current_path}' -w 90% -h 90% -E 'yazi'

# Reload config
bind -n M-R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Scroll mode ─────────────────────────────────────────────
# M-s aliases M-e for cmux (dead-key issue, see M-m above).
bind -n M-e copy-mode
bind -n M-s copy-mode
setw -g mode-keys vi
bind -T copy-mode k send-keys -X -N 5 scroll-up
bind -T copy-mode j send-keys -X -N 5 scroll-down
bind -T copy-mode K send-keys -X halfpage-up
bind -T copy-mode J send-keys -X halfpage-down

# ── Help popup ──────────────────────────────────────────────
bind -n M-/ display-popup -w 52 -h 22 -E 'bash -c "cat <<EOF

  ── Workspace Shortcuts ──

  M-c/x/o/t new pane (claude/codex/opencode/shell)
  M-C/X/O/T new tab  (claude/codex/opencode/shell)
  M-n/M-m   new pane menu
  M-Tab     cycle tabs
  M-[ / M-] prev / next tab
  M-1..5    jump to tab #
  M-hjkl    navigate panes
  M-z       zoom / unzoom pane
  M-r       rotate layout
  M-p       rename pane
  M-y       switch session
  M-g       lazygit
  M-f       yazi file manager
  M-w       kill pane
  M-e/M-s   scroll mode
  M-d       detach
  M-R       reload config
  M-q       quit workspace

  press q to close
EOF
read -rsn1"'

# ── Appearance ──────────────────────────────────────────────
set -g allow-rename off
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status top
set -g status on
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

# Catppuccin (mocha) — swap for latte/frappe/macchiato to taste
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_pane_border_style        "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_peach}"
set -g @catppuccin_window_text " #{=/30/…:#{T:#W}}"
set -g @catppuccin_window_current_text "#{?window_zoomed_flag, Z , }#{=/30/…:#{T:#W}}"
set -g @catppuccin_application_icon ""
set -g @catppuccin_cpu_icon ""
set -g @catppuccin_session_icon ""
set -g @catppuccin_uptime_icon ""
set -g @catppuccin_battery_icon ""
set -g @catppuccin_status_left_separator ""

if-shell "[ -f ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux ]" \
  "run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "#{E:@catppuccin_status_session}"
set -ag  status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

if-shell "[ -f ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux ]" \
  "run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux"
if-shell "[ -f ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux ]" \
  "run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux"

# Final pane-border pass — after plugins, so theme scripts cannot override
# the readability-critical active pane treatment.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f5a97f"
set -g pane-border-format "#{?pane_active,#[bg=#f5a97f]#[fg=#11111b]#[bold] #{=/34/...:#{?@pane_label,#{@pane_label},#{pane_title}}} #[default],#[fg=#a6adc8] #{=/34/...:#{?@pane_label,#{@pane_label},#{pane_title}}} #[default]}"

set -g set-titles on
set -g set-titles-string "#{session_name}"
